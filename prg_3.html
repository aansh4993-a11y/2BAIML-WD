<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Functions </title>
</head>
<body>
    String Functions
    <script>
        let str="Divyanshu World";
        document.write(str+"<br>");
        document.write(str.length+"<br>");
        document.write(str.charAt(2)+"<br>");
        document.write(str.charCodeAt(2)+"<br>");
        document.write(str.concat(" ","How are you?")+"<br>");
        document.write(str.indexOf("o")+"<br>");
        document.write(str.lastIndexOf("o")+"<br>");
        document.write(str.replace("World","Everyone")+"<br>");
        document.write(str.search("World")+"<br>");
        document.write(str.slice(0,5)+"<br>");
        document.write(str.split(" ")+"<br>");
        document.write(str.substring(0,5)+"<br>");
        document.write(str.toLowerCase()+"<br>");
        document.write(str.toUpperCase()+"<br>");
        document.write(str.trim()+"<br>");
        document.write(str.valueOf()+"<br>");
        document.write(str.startsWith("Divyanshu")+"<br>");
        document.write(str.endsWith("World")+"<br>");
        document.write(str.includes("Divyanshu")+"<br>");
        document.write(str.repeat(2)+"<br>");
    </script>
</body>
</html>
